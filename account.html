<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | The Tipster</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Tipster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#07090d;--bg2:#0c0f15;--bg3:#111620;
  --card:#0f141c;--card2:#131a24;
  --border:#1c2535;--border2:#243044;
  --green:#18e07a;--red:#ff3d5a;--gold:#f0b429;--blue:#3b82f6;
  --text:#dde6f0;--muted:#6c83a3;--muted2:#7c828b;
  /* Text on a translucent tinted badge. The tint lightens the card
     underneath, so --muted lands at 4.04-4.31:1 there — under AA — even
     though it clears comfortably on every flat background. Those tints
     are rgba(74,90,112,...), the pre-AA muted colour in decimal form,
     which is why the hex sweep did not catch them. */
  --muted-tint:#738cae;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}

/* NAV */
nav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,9,13,0.95);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--text);text-decoration:none;}
.logo em{color:var(--green);font-style:normal;}
.nav-right{display:flex;gap:10px;align-items:center;}
.btn{font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;border-radius:4px;font-size:13px;}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--text);padding:7px 16px;}
.btn-ghost:hover{border-color:var(--red);color:var(--red);}
.btn-pro{background:var(--gold);border:none;color:#07090d;padding:7px 16px;font-weight:700;}
.btn-pro:hover{background:#ffe066;}

/* LAYOUT */
.page{padding:88px 24px 60px;max-width:900px;margin:0 auto;}
.page-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:36px;}

/* LOADING */
.loading{text-align:center;padding:80px;color:var(--muted);}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* GRID */
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.account-grid.wide{grid-template-columns:1fr;}

/* CARD */
.acard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px 24px;}
.acard-label{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:14px;}
.acard h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin:0 0 12px;}

/* STATUS BADGE */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.status-badge.verified{background:rgba(24,224,122,0.1);color:var(--green);}
.status-badge.unverified{background:rgba(255,61,90,0.1);color:var(--red);}
.status-badge.free{background:rgba(74,90,112,0.2);color:var(--muted-tint);}
.status-badge.pro{background:rgba(240,180,41,0.12);color:var(--gold);}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* INFO ROWS */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-key{font-size:12px;color:var(--muted);}
.info-val{font-size:12px;font-weight:600;}
.info-val.mono{font-family:'Space Mono',monospace;}

/* TOGGLE */
.pref-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.pref-row:last-child{border-bottom:none;}
.pref-label{font-size:13px;font-weight:600;}
.pref-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--muted2);border-radius:11px;cursor:pointer;transition:background 0.2s;}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--text);border-radius:50%;transition:transform 0.2s;}
.toggle input:checked+.toggle-slider{background:var(--green);}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px);}
.toggle input:disabled+.toggle-slider{opacity:0.4;cursor:not-allowed;}

/* FORM */
.form-group{margin-bottom:14px;}
.form-group label{font-size:11px;font-weight:700;display:block;margin-bottom:5px;color:var(--muted);}
.form-group input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:5px;padding:10px 12px;font-size:13px;color:var(--text);font-family:'Lato',sans-serif;outline:none;transition:border-color 0.2s;}
.form-group input:focus{border-color:var(--green);}
/* These fields set outline:none, which left a 1px border-colour change
   as the entire focus indicator. That is hard to see, and for anyone who
   cannot separate those two colours it is no indicator at all — a
   keyboard user then has no way to tell which field they are in.
   focus-visible so a mouse click still looks the way it did; only
   keyboard focus draws the ring. */
.form-group input:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.btn-save{background:var(--green);border:none;color:#07090d;padding:10px 22px;border-radius:5px;font-size:13px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
.btn-save:hover{background:#2fffa0;}
.btn-save:disabled{opacity:0.5;cursor:not-allowed;}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red);padding:9px 18px;border-radius:5px;font-size:12px;font-weight:700;font-family:'Lato',sans-serif;cursor:pointer;transition:all 0.2s;}
.btn-danger:hover{background:rgba(255,61,90,0.08);}

/* UPGRADE BANNER */
.upgrade-banner{background:linear-gradient(135deg,rgba(240,180,41,0.06) 0%,rgba(240,180,41,0.02) 100%);border:1px solid rgba(240,180,41,0.25);border-radius:8px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.upgrade-text h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--gold);margin:0 0 4px;}
.upgrade-text p{font-size:12px;color:var(--muted);line-height:1.5;}

/* ALERT */
.alert{padding:10px 14px;border-radius:5px;font-size:12px;margin-bottom:14px;display:none;}
.alert.success{background:rgba(24,224,122,0.1);border:1px solid rgba(24,224,122,0.3);color:var(--green);}
.alert.error{background:rgba(255,61,90,0.1);border:1px solid rgba(255,61,90,0.3);color:var(--red);}
.alert.show{display:block;}

/* LAST EMAIL */
.email-item{padding:11px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.email-item:last-child{border-bottom:none;}
.email-item-subject{font-size:12px;font-weight:600;margin-bottom:2px;}
.email-item-meta{font-size:11px;color:var(--muted);}
.email-status{font-family:'Space Mono',monospace;font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.email-status.sent{background:rgba(24,224,122,0.1);color:var(--green);}
.email-status.failed{background:rgba(255,61,90,0.1);color:var(--red);}

@media(max-width:640px){
  .page{padding:80px 14px 40px;}
  .account-grid{grid-template-columns:1fr;}
  nav{padding:0 14px;}
  .upgrade-banner{flex-direction:column;align-items:flex-start;}
}

/* Touch targets.

   Keyed on the pointer, not the viewport. These lived in each page's
   max-width block, which asks the wrong question twice over: index.html
   breaks at 600px and the other two at 640, so between those a phone-sized
   window got desktop-sized controls on one page and touch-sized ones on the
   others; and a tablet -- 768px in portrait, 1024 in landscape -- is a touch
   device that never matched any of them, so every control on an iPad was the
   25-30px it is on a laptop.

   (pointer: coarse) is true when the primary input is a finger and false for
   a mouse at any width, which is the actual condition. A touch laptop
   reports a fine primary pointer and is deliberately left alone rather than
   having its controls grow.

   Measured before the change, at 375px:
     index    day tabs, sport chips, odds-format and tier filters 25-27px,
              nav buttons 29, billing toggle 30, modal fields 38
     account  fields 38, save buttons 31-36, switches 40x22
     admin    fourteen under 44, smallest an in-table Edit at 42x23
   24x24 is the WCAG 2.5.8 floor; 44 is what Apple and Google publish. */
@media (pointer: coarse){
  /* Touch targets, measured at 375px.
     Every field was 38px, the save buttons 31-36, Manage Billing 33 and
     Log out / Delete account 35. The four preference switches were 40x22 --
     the height failing the 24px WCAG 2.5.8 floor outright, on the controls
     that include the master email opt-out. */
  .btn,.btn-save,.btn-danger{min-height:44px;display:inline-flex;
    align-items:center;justify-content:center;}
  .form-group input,.form-group select,.form-group textarea{min-height:44px;}
  /* The switch is meant to look small, so the box stays 40x22 and the hit
     area is widened behind it instead. Absolutely positioned, so nothing
     moves; invisible, so nothing looks different. Rows are 54px apart and
     the area is 44, so neighbouring switches do not overlap. */
  .toggle::after{content:'';position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);width:44px;height:44px;}
}


/* Motion is a preference, and this page did not read it.
   Three animations here run forever — the results ticker for 40s a loop, the
   live dot, and the loading shimmer — and continuous motion is the kind that
   causes trouble for vestibular disorders. The blanket rule below near-zeroes
   durations rather than removing them, so anything whose end state matters
   still lands there; the ticker is called out separately because snapping it
   to the end of a translate would leave the track parked half off-screen. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* The confirmation after returning from Stripe. Fixed rather than inline so it
   survives the re-render that reconcileSubscription triggers underneath it. */
.upgrade-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  max-width:min(92vw,420px);background:var(--card,#0f141c);color:var(--text,#dde6f0);
  border:1px solid var(--green,#18e07a);border-radius:8px;padding:14px 20px;
  font-size:13px;line-height:1.6;text-align:center;z-index:999;
  box-shadow:0 8px 28px rgba(0,0,0,.45);animation:toast-in .28s ease}
.upgrade-toast strong{display:block;font-weight:800;margin-bottom:2px}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}
  to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.upgrade-toast{animation:none}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/" aria-label="The Tipster home">The <em>Tipster</em></a>
  <div class="nav-right">
    <a href="/" class="btn btn-ghost" style="text-decoration:none;">Back to Tips</a>
    <button class="btn btn-ghost" onclick="handleLogout()" id="logoutBtn">Log Out</button>
  </div>
</nav>

<div class="page" id="pageContent">
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading your account...</p>
  </div>
</div>

<script>
// ── SUPABASE ──────────────────────────────────────────────
const SUPABASE_URL  = 'https://eyhlzzaaxrwisrtwyoyh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5aGx6emFheHJ3aXNydHd5b3loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNzkyNzcsImV4cCI6MjA4ODk1NTI3N30.iqIk52att2Lv2o6m70Ht1LVWVgqbmLwptDqTxDq12AI';
const ENGINE_URL    = 'https://tipster-engine-1.onrender.com';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let userProfile = null;
let profileError = null;

// Escape anything interpolated into the innerHTML below. This page had none at
// all — the other surfaces were done and this one was missed. first_name is the
// signup field, which has no validation, and it lands in an attribute value
// here: a name containing a double quote breaks out of value="...".
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── INIT ──────────────────────────────────────────────────
// Whether we arrived here from a password reset link.
//
// This was the whole of the password reset flow, and it did not work:
//
//   doForgot() sends a link to /account.html
//   the link carries #access_token=...&type=recovery
//   this page waited for Supabase to exchange it, then rendered the account
//   nothing ever asked for a new password
//
// So the reader ended up signed in with the password they had forgotten, and
// the only form on the page — changePassword — asks for the current password
// and re-authenticates with it. Which is the thing they forgot. There was no
// path from "I cannot get in" to a new password at all.
//
// The recovery session IS the proof of identity; that is what Supabase's
// recovery link is for. So on this path the current-password field comes off
// and updateUser is called directly.
let isRecovery = false;

function readHashParams() {
  const h = (window.location.hash || '').replace(/^#/, '');
  const out = {};
  for (const part of h.split('&')) {
    const i = part.indexOf('=');
    if (i > 0) out[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
  }
  return out;
}

(async () => {
  // A token in the hash is either an email confirmation or a password reset,
  // and they need different things to happen next.
  const hash = readHashParams();
  isRecovery = hash.type === 'recovery';
  if (window.location.hash && window.location.hash.includes('access_token')) {
    // Let Supabase exchange the token automatically
    await new Promise(r => setTimeout(r, 1200));
  }

  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    // Try listening for auth state change (covers token exchange delay)
    db.auth.onAuthStateChange(async (event, newSession) => {
      if (newSession) {
        currentUser = newSession.user;
        // This is the path a confirmation link actually takes.
        await ensureProfile(newSession);
        if (await loadProfile()) {
          await renderPage();
          applyRecoveryMode();
          handleReturnFromCheckout();
          reconcileSubscription();
        } else renderProfileError();
      } else {
        window.location.href = '/?auth=login';
      }
    });
    // Give it 2 seconds, then redirect if still no session
    setTimeout(() => {
      if (!currentUser) window.location.href = '/?auth=login';
    }, 2000);
    return;
  }
  currentUser = session.user;
  await ensureProfile(session);
  if (await loadProfile()) {
    await renderPage();
    applyRecoveryMode();
    // Both run after the page is on screen. The status shown comes from the row
    // first, and is corrected only if Stripe disagrees.
    handleReturnFromCheckout();
    reconcileSubscription();
  } else renderProfileError();
})();

// Shown instead of the account when the profile could not be read. Rendering
// the page anyway would state a subscription status we do not actually know.
function renderProfileError() {
  document.getElementById('pageContent').innerHTML = `
    <h1 class="page-title">My Account</h1>
    <div class="acard" style="margin-top:18px">
      <h2 style="margin:0 0 8px;font-size:16px">We could not load your account</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 14px">
        Your details could not be read just now, so nothing about your subscription is
        shown rather than showing something that might be wrong. Please try again.
      </p>
      <p style="color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;margin:0 0 14px">
        ${esc(profileError || 'unknown error')}
      </p>
      <button class="btn-save" onclick="location.reload()">Try again</button>
      <a class="btn btn-ghost" href="/" style="margin-left:8px">Back to Tips</a>
    </div>`;
}

// ── MAKE SURE THERE IS A PROFILE TO LOAD ──────────────────
//
// Nothing in the codebase creates the public.users row after signup; it is
// assumed to arrive via a database trigger, and the engine has a service-role
// repair route for when it does not. index.html called that route. This page
// did not — and this page is where the signup confirmation link lands
// (emailRedirectTo is '/account.html').
//
// So the very first page a newly confirmed account sees was the one that
// could not create it. With no row: no emails, because the dispatchers select
// from users; preference toggles update nothing; and, worst, paying from the
// upgrade banner right here means checkout.session.completed matches no row,
// answers non-2xx, and Stripe retries for days before giving up. Money taken,
// nobody upgraded.
//
// Idempotent and race-tolerant on the engine side, so it costs one request
// and is a no-op whenever the trigger did its job.
async function ensureProfile(session) {
  try {
    const res = await fetch(ENGINE_URL + '/ensure-profile', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session.access_token },
    });
    return res.ok;
  } catch (e) {
    // Not fatal: loadProfile below reports a missing row honestly, and the
    // next visit tries again. Failing the whole page here would hide an
    // account that exists perfectly well.
    console.error('ensure-profile failed:', e.message);
    return false;
  }
}

// ── LOAD PROFILE ──────────────────────────────────────────
// Returns false when the profile could not be read.
//
// This used to fall back to {}, which renderPage reads as
// subscription_status !== 'pro' — so a failed query showed a paying
// subscriber their account as Free, complete with an Upgrade to Pro banner.
// A read that did not happen is not the same as an account with no
// subscription, and RLS makes the first case far more likely.
async function loadProfile() {
  const { data, error } = await db
    .from('users')
    .select('*')
    .eq('id', currentUser.id)
    .single();
  // PGRST116 is "no row", which is a real state — the profile row has not been
  // created yet. Anything else means the read failed.
  if (error && error.code !== 'PGRST116') {
    console.error('loadProfile:', error.message);
    profileError = error.message;
    return false;
  }
  userProfile = data || {};
  profileError = null;
  return true;
}

// ── LOAD RECENT EMAILS ────────────────────────────────────
// null means the log could not be read, [] means nothing has been sent yet.
async function loadRecentEmails() {
  const { data, error } = await db
    .from('email_log')
    .select('*')
    .eq('recipient', currentUser.email)
    .order('sent_at', { ascending: false })
    .limit(5);
  if (error) { console.error('loadRecentEmails:', error.message); return null; }
  return data || [];
}

// ── RECONCILE WITH STRIPE ───────────────────────────
// The row in `users` is written by the Stripe webhook, so it is right only if
// every webhook arrived. A dropped or delayed event leaves this page confidently
// showing the wrong thing — a subscriber who has just paid seeing Free, with an
// Upgrade to Pro banner, is the version of that which loses the customer.
//
// /verify-pro asks Stripe directly and corrects the row. It answers
// { isPro, verified }: verified false means Stripe could not be reached, and
// then nothing on this page should change, because what is on record is still
// the best answer available. The engine takes the account from the token, so
// there is nothing to send.
//
// Never blocks the first render, and never shows an error: this is a correction
// to something already displayed, and a failed correction leaves it as it was.
async function reconcileSubscription() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return null;
    const res = await fetch(ENGINE_URL + '/verify-pro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || data.verified !== true) return null;

    const wasPro = userProfile.subscription_status === 'pro';
    if (data.isPro !== wasPro) {
      // The engine has already written this to the row; keep the copy this page
      // renders from in step rather than re-reading it.
      userProfile.subscription_status = data.isPro ? 'pro' : 'free';
      await renderPage();
    }
    return data.isPro;
  } catch (e) {
    console.error('reconcileSubscription:', e.message);
    return null;
  }
}

// Shown when someone lands here from Stripe. The webhook usually beats the
// redirect, but not always, so the message says what is true either way and the
// status above it is reconciled independently.
// Turn the Security card into "set a new password" when we came from a reset
// link. Called after renderPage, because the card is part of what it renders.
function applyRecoveryMode() {
  if (!isRecovery) return;
  const group = document.getElementById('currentPwGroup');
  const label = document.getElementById('pwCardLabel');
  const note  = document.getElementById('pwRecoveryNote');
  const btn   = document.getElementById('pwSubmit');
  if (group) group.style.display = 'none';
  if (label) label.textContent = 'Set a new password';
  if (note)  note.style.display = 'block';
  if (btn)   { btn.textContent = 'Set password'; btn.setAttribute('onclick', 'setRecoveryPassword()'); }
  const card = label && label.closest('.acard');
  if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center' });
  const first = document.getElementById('newPw');
  if (first && first.focus) first.focus();
}

// The reset path. No current password, because the recovery session is the
// proof — demanding the old one here is what made the flow impossible.
async function setRecoveryPassword() {
  const pw      = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  const alert   = document.getElementById('pwAlert');

  if (pw.length < 8)  { showAlert(alert, 'New password must be at least 8 characters.', 'error'); return; }
  if (pw !== confirm) { showAlert(alert, 'Passwords do not match.', 'error'); return; }

  const { error } = await db.auth.updateUser({ password: pw });
  if (error) {
    // A recovery session is short-lived. Say which of the two things went
    // wrong, because "try again" means different things for each.
    showAlert(alert, /expired|invalid|jwt/i.test(error.message || '')
      ? 'That reset link has expired. Request a new one from the sign-in page.'
      : error.message, 'error');
    return;
  }

  document.getElementById('newPw').value = '';
  document.getElementById('confirmPw').value = '';

  // Same eviction as a deliberate change: whoever prompted the reset should
  // not still be signed in somewhere.
  let evicted = true;
  try { const { error: soErr } = await db.auth.signOut({ scope: 'others' }); if (soErr) evicted = false; }
  catch (_) { evicted = false; }

  // Out of recovery mode, so the card goes back to being the ordinary one.
  isRecovery = false;
  history.replaceState({}, '', '/account.html');
  const group = document.getElementById('currentPwGroup');
  const label = document.getElementById('pwCardLabel');
  const note  = document.getElementById('pwRecoveryNote');
  const btn   = document.getElementById('pwSubmit');
  if (group) group.style.display = '';
  if (label) label.textContent = 'Security';
  if (note)  note.style.display = 'none';
  if (btn)   { btn.textContent = 'Update password'; btn.setAttribute('onclick', 'changePassword()'); }

  showAlert(alert, evicted
    ? 'Password set. Other devices have been signed out.'
    : 'Password set.', 'success');
}

function showUpgradeConfirmed(settled) {
  const el = document.createElement('div');
  el.className = 'upgrade-toast';
  el.setAttribute('role', 'status');
  el.innerHTML = settled
    ? '<strong>Welcome to Pro.</strong> Your full card arrives tomorrow at 07:00.'
    : '<strong>Payment received.</strong> Your account will show as Pro within a few minutes.';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 9000);
}

// Stripe sends the subscriber back here, and the redirect can beat the webhook
// that makes them Pro. Check a few times over the first few seconds rather than
// leaving them looking at an Upgrade banner they have just paid to remove.
async function handleReturnFromCheckout() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('upgraded') !== '1') return;
  window.history.replaceState({}, '', '/account.html');

  for (let attempt = 0; attempt < 5; attempt++) {
    const isPro = await reconcileSubscription();
    if (isPro === true) { showUpgradeConfirmed(true); return; }
    await new Promise(r => setTimeout(r, 2000));
  }
  // Ten seconds is long enough that something is behind. Say so plainly rather
  // than either claiming success or implying the payment failed.
  showUpgradeConfirmed(false);
}

// ── SAVE PROFILE ──────────────────────────────────────────
async function saveProfile() {
  const btn = document.getElementById('saveProfileBtn');
  const alert = document.getElementById('profileAlert');
  const firstName = document.getElementById('firstName').value.trim();

  // The same rules signup applies. It enforces a name and a 60-character
  // ceiling because first_name is rendered in every email, on this page and in
  // the admin table — and then this page let you set it to anything at all,
  // including nothing. One field, two rules, and the looser one was the one you
  // could reach after signing up.
  if (!firstName) { showAlert(alert, 'Enter your first name.', 'error'); return; }
  if (firstName.length > 60) {
    showAlert(alert, 'Please use 60 characters or fewer.', 'error'); return;
  }

  btn.disabled = true; btn.textContent = 'Saving...';
  // .select() so a write that is REFUSED rather than failed is caught. An RLS
  // policy that denies the update returns no error and no rows, and without
  // this the page said "Profile updated." over a database that had not
  // changed — the same failure the unsubscribe route was fixed for.
  const { data, error } = await db.from('users')
    .update({ first_name: firstName }).eq('id', currentUser.id).select('id');
  btn.disabled = false; btn.textContent = 'Save changes';

  if (error) { showAlert(alert, 'Could not save: ' + error.message, 'error'); return; }
  if (!data || !data.length) {
    showAlert(alert, 'That did not save. Please sign out and back in, then try again.', 'error');
    return;
  }
  userProfile.first_name = firstName;
  showAlert(alert, 'Profile updated.', 'success');
}

// ── SAVE PREFERENCE TOGGLE ────────────────────────────────
async function savePref(field, value) {
  const alert = document.getElementById('prefAlert');

  // .select() for the same reason as above, and it matters more here: a
  // subscriber who turns the daily email off, is told "Preference saved" and
  // keeps receiving it has been told the opposite of what happened, about the
  // one setting they are most likely to check.
  const { data, error } = await db.from('users')
    .update({ [field]: value }).eq('id', currentUser.id).select('id');
  const saved = !error && data && data.length;

  if (!saved) {
    // Put the switch back. Leaving it showing the new state means the page and
    // the database disagree until the next reload, which is when it silently
    // flips back.
    const box = document.getElementById(
      field === 'email_opt_in' ? 'pref-opt-in'
      : field === 'email_daily' ? 'pref-daily' : 'pref-saturday');
    if (box) box.checked = !value;
    showAlert(alert, 'Could not save preference.', 'error');
    return;
  }

  userProfile[field] = value;

  // Only after the write. The child toggles used to be disabled first, so a
  // refused write left them greyed out while the master switch was still on.
  if (field === 'email_opt_in') {
    const daily = document.getElementById('pref-daily');
    const sat   = document.getElementById('pref-saturday');
    if (daily) daily.disabled = !value;
    if (sat)   sat.disabled   = !value;
  }
  showAlert(alert, 'Preference saved.', 'success');
}

// ── CHANGE PASSWORD ───────────────────────────────────────
async function changePassword() {
  const currentEl = document.getElementById('currentPw');
  const current = currentEl.value;
  const pw      = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  const alert   = document.getElementById('pwAlert');

  if (!current)       { showAlert(alert, 'Enter your current password.', 'error'); return; }
  if (pw.length < 8)  { showAlert(alert, 'New password must be at least 8 characters.', 'error'); return; }
  if (pw !== confirm) { showAlert(alert, 'Passwords do not match.', 'error'); return; }
  if (pw === current) { showAlert(alert, 'New password must be different from your current one.', 'error'); return; }

  // Re-authenticate first. Supabase updates the password from any live session,
  // so without this an unattended logged-in browser is enough for someone to
  // take the account over and lock the real owner out.
  const { error: reauthErr } = await db.auth.signInWithPassword({ email: currentUser.email, password: current });
  if (reauthErr) { showAlert(alert, 'Current password is incorrect.', 'error'); return; }

  const { error } = await db.auth.updateUser({ password: pw });
  if (error) { showAlert(alert, error.message, 'error'); return; }

  currentEl.value = '';
  document.getElementById('newPw').value = '';
  document.getElementById('confirmPw').value = '';

  // Evict every other session, so changing the password actually removes
  // whoever prompted the change. This session stays signed in.
  let evicted = true;
  try { const { error: soErr } = await db.auth.signOut({ scope: 'others' }); if (soErr) evicted = false; }
  catch (_) { evicted = false; }

  showAlert(alert, evicted
    ? 'Password updated. Other devices have been signed out.'
    : 'Password updated.', 'success');
}

// ── RESEND VERIFICATION ───────────────────────────────────
async function resendVerification() {
  const alert = document.getElementById('verifyAlert');
  const { error } = await db.auth.resend({ type: 'signup', email: currentUser.email });
  showAlert(alert, error ? error.message : 'Verification email sent. Check your inbox.', error ? 'error' : 'success');
}

// ── LOGOUT ────────────────────────────────────────────────
async function manageSubscription() {
  // Ask the engine for a portal session tied to this account. That drops the
  // user straight into their billing page; the hosted login link below only
  // emails them a magic link, which is a round trip they do not need.
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      const res = await fetch(ENGINE_URL + '/stripe/portal', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token },
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (data.url) { window.location.href = data.url; return; }
    }
  } catch (e) {
    console.error('Portal session failed, falling back to hosted login:', e.message);
  }
  // Fallback keeps billing reachable if the engine is down, or is still on a
  // build whose /stripe/portal predates JWT auth.
  window.location.href = 'https://billing.stripe.com/p/login/aFaeVdbdwfNMaKQ3LM2oE00';
}

async function handleLogout() {
  await db.auth.signOut();
  window.location.href = '/';
}

// ── DELETE ACCOUNT ────────────────────────────────────────
function confirmDeleteAccount() {
  // This used to warn "this cannot be undone", then do nothing but say
  // "contact support" — without saying how. Deletion is handled by request;
  // say so plainly up front, and open a prefilled email so it actually happens.
  const email = (currentUser && currentUser.email) || '';
  const ok = confirm(
    'Account deletion is handled by our support team.\n\n' +
    'Click OK to open an email requesting deletion. We will confirm once your ' +
    'account and personal data have been removed.\n\n' +
    'If you have an active subscription, cancel it first under Manage Billing — ' +
    'deleting your account does not stop billing.'
  );
  if (!ok) return;
  const subject = encodeURIComponent('Account deletion request');
  const body = encodeURIComponent(
    'Please delete my account and associated personal data.\n\nAccount email: ' + email + '\n'
  );
  window.location.href = 'mailto:support@thetipsteredge.com?subject=' + subject + '&body=' + body;
}

// ── ALERT HELPER ─────────────────────────────────────────
function showAlert(el, msg, type) {
  if (!el) return;
  el.textContent = msg;
  el.className   = 'alert ' + type + ' show';
  setTimeout(() => { el.className = 'alert'; }, 4000);
}

// ── ODDS FORMAT ───────────────────────────────────────────
// Stores preference in localStorage. Display only — no calculations change.
// The toggle on the page reads this on render. index.html also reads it.
function setOddsFormat(isFractional) {
  localStorage.setItem('oddsFormat', isFractional ? 'fractional' : 'decimal');
  // The confirmation goes in the row's own subtitle rather than the page's
  // alert bar. This used to call showAlert with a throwaway object literal as
  // the element, which set textContent on nothing anyone could see and left a
  // four-second timer behind to clear it again.
  const sub = document.querySelector('#pref-fractional')?.closest('.pref-row')?.querySelector('.pref-sub');
  if (sub) {
    const orig = sub.textContent;
    sub.textContent = isFractional ? '✓ Odds will show as fractions (e.g. 5/2)' : '✓ Odds will show as decimals (e.g. 3.50)';
    sub.style.color = 'var(--green)';
    setTimeout(() => { sub.textContent = orig; sub.style.color = ''; }, 2500);
  }
}

// Set the toggle state from localStorage on page load
window.addEventListener('DOMContentLoaded', () => {
  const toggle = document.getElementById('pref-fractional');
  if (toggle) toggle.checked = localStorage.getItem('oddsFormat') === 'fractional';
});
