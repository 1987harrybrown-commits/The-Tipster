<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090d"/>
      <stop offset="100%" style="stop-color:#0c1420"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#18e07a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#18e07a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#18e07a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1c2535" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1c2535" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1c2535" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1c2535" stroke-width="1"/>

  <!-- Green glow band -->
  <rect x="0" y="280" width="1200" height="70" fill="url(#glow)"/>

  <!-- Top label -->
  <text x="600" y="180" font-family="monospace" font-size="14" font-weight="700" fill="#18e07a" text-anchor="middle" letter-spacing="6">DATA-DRIVEN SPORTS INTELLIGENCE</text>

  <!-- Main logo -->
  <text x="600" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#dde6f0" text-anchor="middle">The <tspan fill="#18e07a">Tipster</tspan></text>

  <!-- Subtitle -->
  <text x="600" y="370" font-family="monospace" font-size="20" fill="#6c83a3" text-anchor="middle">Free football tips · Value bets · Verified track record</text>

  <!-- Stats row -->
  <rect x="200" y="430" width="240" height="80" rx="8" fill="#0f141c" stroke="#1c2535" stroke-width="1"/>
  <text x="320" y="462" font-family="monospace" font-size="11" fill="#6c83a3" text-anchor="middle" letter-spacing="2">WIN RATE</text>
  <text x="320" y="496" font-family="monospace" font-size="28" font-weight="bold" fill="#18e07a" text-anchor="middle">68%+</text>

  <rect x="480" y="430" width="240" height="80" rx="8" fill="#0f141c" stroke="#1c2535" stroke-width="1"/>
  <text x="600" y="462" font-family="monospace" font-size="11" fill="#6c83a3" text-anchor="middle" letter-spacing="2">UPDATES</text>
  <text x="600" y="496" font-family="monospace" font-size="28" font-weight="bold" fill="#dde6f0" text-anchor="middle">15 MIN</text>

  <rect x="760" y="430" width="240" height="80" rx="8" fill="#0f141c" stroke="#1c2535" stroke-width="1"/>
  <text x="880" y="462" font-family="monospace" font-size="11" fill="#6c83a3" text-anchor="middle" letter-spacing="2">FREE TO START</text>
  <text x="880" y="496" font-family="monospace" font-size="28" font-weight="bold" fill="#f0b429" text-anchor="middle">£0</text>

  <!-- Bottom URL -->
  <text x="600" y="590" font-family="monospace" font-size="16" fill="#7c828b" text-anchor="middle">thetipsteredge.com</text>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#1c2535" stroke-width="2"/>
  <!-- Green top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#18e07a"/>
</svg>
